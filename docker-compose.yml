services:
  postgres:
    image: postgres:15-alpine
    container_name: medical_scribe_postgres
    environment:
      POSTGRES_USER: medscribe
      POSTGRES_PASSWORD: medscribe_password
      POSTGRES_DB: medical_scribe_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medscribe"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medical_scribe_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medical_scribe_backend
    environment:
      - DATABASE_URL=postgresql://medscribe:medscribe_password@postgres:5432/medical_scribe_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./backend:/app
      - audio_storage:/app/audio_storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        - REACT_APP_CLERK_PUBLISHABLE_KEY=${REACT_APP_CLERK_PUBLISHABLE_KEY}
    container_name: medical_scribe_frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000
      - REACT_APP_CLERK_PUBLISHABLE_KEY=${REACT_APP_CLERK_PUBLISHABLE_KEY}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - ESLINT_NO_DEV_ERRORS=true
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/.env.local:/app/.env.local
      - ./frontend/.env:/app/.env
    ports:
      - "3000:3100"
    depends_on:
      - backend
    command: npm start

  # nginx:
  #   image: nginx:alpine
  #   container_name: medical_scribe_nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
